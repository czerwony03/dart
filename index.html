<html lang="en">

  <style>
    /* ─── Reset & Base ───────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #12121e;
      color: #e8e8e8;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ─── Buttons ────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      user-select: none;
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active:not(:disabled) { transform: scale(0.95); }
    .btn:disabled { opacity: 0.38; cursor: default; }

    .btn-red   { background: #e94560; color: #fff; }
    .btn-green { background: #27ae60; color: #fff; }
    .btn-gray  { background: #2e2e4a; color: #ccc; }
    .btn-amber { background: #e67e22; color: #fff; }
    .btn-icon  { padding: 0.75rem; width: 44px; height: 44px; border-radius: 10px; }
    .btn-sm    { font-size: 0.78rem; padding: 0.4rem 0.75rem; border-radius: 8px; }

    /* ─── Inputs ─────────────────────────────────────────────────────────────── */
    input[type="text"],
    input[type="number"] {
      padding: 0.8rem 1rem;
      border: 2px solid #2e2e4a;
      border-radius: 10px;
      background: #1c1c30;
      color: #fff;
      font-size: 1rem;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus { border-color: #e94560; }

    /* ─── HOME SCREEN ────────────────────────────────────────────────────────── */
    .home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem 3rem;
      gap: 1.25rem;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .home-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding-top: 0.5rem;
    }

    .home-emoji { font-size: 4rem; line-height: 1; }

    .home-title {
      font-size: 2.4rem;
      font-weight: 800;
      color: #e94560;
      letter-spacing: -0.5px;
    }

    .home-full-width {
      width: 100%;
      max-width: 420px;
    }

    /* Active (in-progress) game card */
    .active-card {
      width: 100%;
      max-width: 420px;
      background: #1a1a2e;
      border: 2px solid #27ae60;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .active-badge {
      display: inline-block;
      background: #27ae60;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      margin-bottom: 0.3rem;
    }

    .active-players { font-weight: 600; font-size: 0.95rem; }
    .active-meta    { font-size: 0.78rem; color: #888; margin-top: 0.15rem; }

    /* History section */
    .history-section {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .history-list { display: flex; flex-direction: column; gap: 0.45rem; }

    .hist-item {
      background: #171730;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .hist-item:hover,
    .hist-item:focus { background: #1f1f42; outline: none; }

    .hist-info   { flex: 1; min-width: 0; }
    .hist-winner { font-weight: 700; font-size: 0.88rem; }
    .hist-meta   { font-size: 0.73rem; color: #888; margin-top: 0.1rem;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-date   { font-size: 0.7rem; color: #555; margin-top: 0.1rem; }

    .hist-player-list { margin-top: 0.3rem; display: flex; flex-direction: column; gap: 0.12rem; }
    .hist-player-row  { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; }
    .hist-player-row .hp-avg { color: #666; margin-left: 0.5rem; white-space: nowrap; }

    .del-btn { color: #666; background: #0e0e20; flex-shrink: 0; }
    .del-btn:hover { color: #e94560; background: #1a0010; }

    .empty-hint { color: #444; font-size: 0.9rem; }

    /* ─── SETUP SCREEN ───────────────────────────────────────────────────────── */
    .setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem 1.5rem 3rem;
      gap: 1.25rem;
    }

    .setup-emoji { font-size: 4rem; line-height: 1; }

    .setup-title {
      font-size: 2rem;
      font-weight: 800;
      color: #e94560;
      letter-spacing: -0.5px;
    }

    .setup-subtitle { color: #666; font-size: 0.9rem; }

    .back-btn { align-self: flex-start; }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .player-num {
      color: #555;
      font-size: 0.85rem;
      min-width: 22px;
      text-align: right;
      flex-shrink: 0;
    }

    .setup-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
    }

    .setup-error {
      color: #e94560;
      font-size: 0.82rem;
      text-align: center;
    }

    /* ─── GAME SCREEN ────────────────────────────────────────────────────────── */
    .game-screen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: #0e1a35;
      flex-shrink: 0;
      gap: 0.5rem;
    }

    .round-badge {
      background: #e94560;
      color: #fff;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .cp-name {
      font-weight: 700;
      font-size: 1rem;
      color: #ffd700;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .dart-counter { font-size: 0.82rem; color: #888; }

    .home-icon {
      background: transparent;
      color: #666;
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 1.1rem;
      border-radius: 8px;
    }

    .home-icon:hover { color: #ccc; background: #1a1a30; }

    .share-icon {
      background: transparent;
      color: #4a9eff;
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 1rem;
      border-radius: 8px;
    }

    .share-icon:hover { color: #7bbfff; background: #0a1a2e; }

    .history-icon {
      background: transparent;
      color: #b58cff;
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 1rem;
      border-radius: 8px;
    }

    .history-icon:hover { color: #d2bcff; background: #1a1030; }

    /* Scoreboard */
    .scoreboard {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      background: #171730;
      padding: 0.4rem 0.9rem;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .scoreboard::-webkit-scrollbar { display: none; }

    .score-card {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      background: #0e1a35;
      min-width: 60px;
      transition: background 0.2s;
    }

    .score-card-btn {
      border: none;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }

    .score-card.active { background: #e94560; }

    .sc-name {
      font-size: 0.65rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 68px;
    }

    .sc-val { font-size: 1.35rem; font-weight: 700; }

    .sc-avg { font-size: 0.6rem; color: rgba(255,255,255,0.55); line-height: 1; }

    /* Dartboard */
    .dartboard-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      overflow: hidden;
    }

    .dartboard-svg {
      width: 100%;
      height: 100%;
      max-width: 460px;
      max-height: 460px;
    }

    .dseg { cursor: pointer; transition: opacity 0.1s; }
    .dseg:hover  { opacity: 0.78; }
    .dseg:active { opacity: 0.55; }

    /* Bottom panel */
    .game-bottom { flex-shrink: 0; background: #0b0b1a; }

    .throw-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 1rem;
      background: #171730;
    }

    .dart-chips { display: flex; gap: 0.4rem; flex: 1; }

    .chip {
      flex: 1;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .chip-used  { background: #1d5c36; color: #7effc0; }
    .chip-miss  { background: #3a2000; color: #ffa040; }
    .chip-empty { background: #1a1a30; border: 1px dashed #2e2e4e; color: #333; }

    .turn-lbl { font-size: 0.65rem; color: #666; line-height: 1; }
    .turn-score {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 0.35rem;
    }
    .turn-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffd700;
      min-width: 50px;
      text-align: right;
    }
    .turn-left {
      font-size: 0.72rem;
      line-height: 1;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 0.2rem;
      min-width: 2.4rem;
      text-align: right;
    }

    .bust-bar {
      text-align: center;
      color: #ff4444;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.28rem;
      background: #1f0000;
    }

    .manual-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
    }

    .manual-row input { min-width: 0; }

    .action-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.4rem 1rem 0.6rem;
    }

    .history-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .history-modal {
      width: min(520px, 100%);
      max-height: min(75vh, 700px);
      background: #121a31;
      border: 1px solid #2e2e4a;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .history-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #2e2e4a;
    }

    .history-modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffd700;
    }

    .history-modal-content {
      padding: 0.85rem 1rem 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .history-player-block {
      background: #0b1230;
      border: 1px solid #232f56;
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
    }

    .history-player-name {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.45rem;
      color: #9ec0ff;
    }

    .history-turn-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .history-turn-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #d3d8e6;
    }

    .history-turn-meta {
      font-size: 0.72rem;
      color: #888fa8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      font-size: 0.78rem;
      color: #6f7899;
    }

    /* ─── WIN SCREEN ─────────────────────────────────────────────────────────── */
    .win-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem 1.5rem 3rem;
      gap: 1.25rem;
      text-align: center;
    }

    .trophy { font-size: 6rem; line-height: 1; }

    .win-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffd700;
    }

    .win-sub  { color: #666; font-size: 0.92rem; }
    .win-date { color: #444; font-size: 0.8rem;  }

    .final-scores {
      background: #171730;
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
      width: 100%;
      max-width: 340px;
    }

    .fs-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid #2a2a40;
      font-size: 0.93rem;
    }

    .fs-row:last-child { border-bottom: none; }
    .fs-row.winner-row { color: #ffd700; font-weight: 700; }

    .win-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 340px;
    }

    /* ─── Language selector ──────────────────────────────────────────────────── */
    .lang-selector {
      display: flex;
      gap: 0.3rem;
      align-self: flex-end;
      width: 100%;
      max-width: 420px;
      justify-content: flex-end;
    }

    .lang-btn {
      background: #2e2e4a;
      color: #888;
      border: none;
      border-radius: 8px;
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn.lang-active { background: #e94560; color: #fff; }

    /* ─── Finish-mode toggle (setup screen) ─────────────────────────────────── */
    .finish-toggle-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
      max-width: 420px;
    }

    .finish-toggle-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .finish-toggle {
      display: flex;
      gap: 0.5rem;
    }

    .finish-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      border: 2px solid #2e2e4a;
      border-radius: 10px;
      background: #1c1c30;
      color: #888;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      text-align: center;
    }

    .finish-btn.finish-active {
      border-color: #e94560;
      background: #2a0a14;
      color: #e94560;
    }

    /* ─── Checkout hints (game screen) ──────────────────────────────────────── */
    .checkout-hint {
      flex: 1;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      color: #ffd700;
      opacity: 0.85;
      min-height: 14px;
      line-height: 14px;
      pointer-events: none;
    }

    /* ─── Toast ──────────────────────────────────────────────────────────────── */
    .toast-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
    }

    .toast-inner {
      background: #b81c2e;
      color: #fff;
      font-size: 2rem;
      font-weight: 800;
      padding: 0.75rem 2rem;
      border-radius: 14px;
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.18s, transform 0.18s;
    }

    .toast-inner.show { opacity: 1; transform: scale(1); }
  </style>
</head>

/* ─── Language context ───────────────────────────────────────────────────────── */
const LangContext = React.createContext({ lang: 'en', setLang: () => {}, t: k => k });
function useLang() { return React.useContext(LangContext); }

/* ─── localStorage helpers ───────────────────────────────────────────────────── */
const readActive   = () => { try { return JSON.parse(localStorage.getItem(LS_ACTIVE))  || null; } catch { return null; } };
const writeActive  = g  => {
  if (!g) return;
  try {
    localStorage.setItem(LS_ACTIVE, JSON.stringify(g));
  } catch {
    /* private mode / quota exceeded — silently ignore autosave */
  }
};
const clearActive  = () => localStorage.removeItem(LS_ACTIVE);
const readHistory  = () => { try { return JSON.parse(localStorage.getItem(LS_HISTORY)) || [];   } catch { return []; }   };
const writeHistory = h  => localStorage.setItem(LS_HISTORY, JSON.stringify(h));
const readPlayerSuggestions = () => {
  try {
    const data = JSON.parse(localStorage.getItem(LS_PLAYER_SUGGESTIONS));
    if (!Array.isArray(data)) return [];
    return data
      .map(name => typeof name === 'string' ? name.trim() : '')
      .filter(Boolean);
  } catch {
    return [];
  }
};
const writePlayerSuggestions = names => {
  try { localStorage.setItem(LS_PLAYER_SUGGESTIONS, JSON.stringify(names)); } catch { /* ignore */ }
};

function dedupePlayerNames(names) {
  const seen = new Set();
  return names.filter(name => {
    const key = name.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function updatePlayerSuggestions(names) {
  const normalized = (Array.isArray(names) ? names : [])
    .map(name => typeof name === 'string' ? name.trim() : '')
    .filter(Boolean);
  if (normalized.length === 0) return readPlayerSuggestions();
  const merged = dedupePlayerNames([...normalized, ...readPlayerSuggestions()]).slice(0, 50);
  writePlayerSuggestions(merged);
  return merged;
}

function getPlayerNameSuggestions() {
  const normalizeNames = names => (Array.isArray(names) ? names : [])
    .map(name => typeof name === 'string' ? name.trim() : '')
    .filter(Boolean);

  const historyNames = readHistory().flatMap(g => normalizeNames(g?.players));
  const activeNames  = normalizeNames(readActive()?.players);
  return dedupePlayerNames([
    ...readPlayerSuggestions(),
    ...activeNames,
    ...historyNames,
  ]).slice(0, 50);
}

function pushToHistory(game) {
  const h   = readHistory();
  const idx = h.findIndex(g => g.id === game.id);
  if (idx >= 0) h[idx] = game; else h.unshift(game);
  writeHistory(h);
}

/* ─── URL helpers ────────────────────────────────────────────────────────────── */
function normalizeLang(lang) {
  const normalized = typeof lang === 'string' ? lang.trim().toLowerCase() : '';
  return normalized === 'pl' ? 'pl' : normalized === 'en' ? 'en' : null;
}
function getGameIdFromUrl() {
  try { return new URLSearchParams(window.location.search).get(GAME_ID_PARAM) || null; } catch { return null; }
}
function getLangFromUrl() {
  try { return normalizeLang(new URLSearchParams(window.location.search).get(LANG_PARAM)); } catch { return null; }
}
function setGameUrlParam(id, lang) {
  try {
    const u = new URL(window.location.href);
    u.search = '';
    u.searchParams.set(GAME_ID_PARAM, id);
    const normalizedLang = normalizeLang(lang);
    if (normalizedLang) u.searchParams.set(LANG_PARAM, normalizedLang);
    window.history.replaceState(null, '', u.toString());
  } catch { /* noop */ }
}
function clearGameUrlParam(lang) {
  try {
    const u = new URL(window.location.href);
    u.search = '';
    const normalizedLang = normalizeLang(lang);
    if (normalizedLang) u.searchParams.set(LANG_PARAM, normalizedLang);
    window.history.replaceState(null, '', u.toString());
  } catch { /* noop */ }
}
function getGameShareUrl(id, lang) {
  try {
    const u = new URL(window.location.href);
    u.search = '';
    u.searchParams.set(GAME_ID_PARAM, id);
    const normalizedLang = normalizeLang(lang);
    if (normalizedLang) u.searchParams.set(LANG_PARAM, normalizedLang);
    return u.toString();
  } catch {
    return `${window.location.origin}${window.location.pathname}?${GAME_ID_PARAM}=${encodeURIComponent(id)}`;
  }
}

/* ─── Backend sync helpers ───────────────────────────────────────────────────── */
function syncToBackend(game) {
  if (!game?.id) return;
  fetch(API_GAME_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: game.id, state: game }),
  }).catch(() => {}); // fire-and-forget — silently ignore offline errors
}

async function fetchFromBackend(id) {
  const res = await fetch(`${API_GAME_URL}?id=${encodeURIComponent(id)}`);
  if (!res.ok) return null;
  const data = await res.json();
  return data?.id ? data : null;
}

/* ─── Game factory ───────────────────────────────────────────────────────────── */
function genId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function normalizeFinishMode(mode) {
  return mode === 'single' ? 'single' : 'double';
}

function shufflePlayers(players) {
  const original = [...players];
  if (original.length < 2) return original;

  const canChangeOrder = new Set(original).size > 1;
  if (!canChangeOrder) return [...original];

  for (let attempt = 0; attempt < 5; attempt++) {
    const shuffled = [...original];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    if (!shuffled.every((name, i) => name === original[i])) return shuffled;
  }

  return [...original.slice(1), original[0]];
}

function newGame(players, opts = {}) {
  const startScore = opts.startScore || 501;
  const finishMode = normalizeFinishMode(opts.finishMode);
  return {
    id:            genId(),
    phase:         'playing',
    players,
    startScore,
    finishMode,
    scores:        players.map(() => startScore),
    currentPlayer: 0,
    round:         1,
    darts:         [],
    turnScore:     0,
    isBust:        false,
    winner:        -1,
    updatedAt:     Date.now(),
    startedAt:     Date.now(),
    finishedAt:    null,
    nextGameId:    null,
    stateHistory:  [],
  };
}

/* ─── Per-player avg round score for a completed game ───────────────────────── */
function playerAvg(g, i) {
  const pointsScored    = g.startScore - g.scores[i];
  const roundsCompleted = i > g.winner ? g.round - 1 : g.round;
  return roundsCompleted > 0 ? (pointsScored / roundsCompleted).toFixed(1) : '—';
}

/* ─── Date formatting ────────────────────────────────────────────────────────── */
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
    + ' · ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

/* ─── Toast hook ─────────────────────────────────────────────────────────────── */
function useToast() {
  const [msg, setMsg]  = useState('');
  const timerRef       = useRef(null);
  const show           = useCallback(m => {
    setMsg(m);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setMsg(''), 950);
  }, []);
  return [msg, show];
}

/* ─── Dartboard SVG ──────────────────────────────────────────────────────────── */
const Dartboard = memo(function Dartboard({ onHit }) {
  const { t } = useLang();
  const CX = 180, CY = 180, DEG = 18;
  const R  = { BOARD: 175, NUM: 164, DBL_O: 155, DBL_I: 140,
               TPL_O: 98,  TPL_I: 83, BULL_O: 26, BULL_I: 12 };

  /* Stable geometry — computed once regardless of onHit reference */
  const segData = useMemo(() => {
    const pts = (r, deg) => {
      const rad = (deg - 90) * Math.PI / 180;
      return { x: CX + r * Math.cos(rad), y: CY + r * Math.sin(rad) };
    };
    const arc = (rIn, rOut, a1, a2) => {
      const p1 = pts(rOut, a1), p2 = pts(rOut, a2);
      const p3 = pts(rIn,  a2), p4 = pts(rIn,  a1);
      const lg = (a2 - a1) > 180 ? 1 : 0;
      const f  = v => v.toFixed(2);
      return `M${f(p1.x)} ${f(p1.y)} A${rOut} ${rOut} 0 ${lg} 1 ${f(p2.x)} ${f(p2.y)} `
           + `L${f(p3.x)} ${f(p3.y)} A${rIn} ${rIn} 0 ${lg} 0 ${f(p4.x)} ${f(p4.y)} Z`;
    };
    const data = [];
    BOARD.forEach((num, i) => {
      const a1 = i * DEG - DEG / 2, a2 = a1 + DEG;
      const light = i % 2 === 0;
      const bc    = light ? '#1e1e1e' : '#f0d9a8';
      const rc    = light ? '#c0392b' : '#27ae60';
      const lp    = pts(R.NUM, i * DEG);
      data.push(
        { type: 'path', key: `si${num}`, d: arc(R.TPL_O, R.DBL_I, a1, a2), fill: bc, score: num,     label: String(num) },
        { type: 'path', key: `so${num}`, d: arc(R.BULL_O, R.TPL_I, a1, a2), fill: bc, score: num,     label: String(num) },
        { type: 'path', key: `t${num}`,  d: arc(R.TPL_I, R.TPL_O, a1, a2), fill: rc, score: num * 3, label: `T${num}` },
        { type: 'path', key: `d${num}`,  d: arc(R.DBL_I, R.DBL_O, a1, a2), fill: rc, score: num * 2, label: `D${num}` },
        { type: 'text', key: `n${num}`,  x: lp.x.toFixed(1), y: lp.y.toFixed(1), label: String(num) },
      );
    });
    return data;
  }, []); // no deps — board geometry never changes

  return (
    <svg className="dartboard-svg" viewBox="0 0 360 360"
         role="img" aria-label={t('dartboardLabel')}>
      <circle cx={CX} cy={CY} r={R.BOARD} fill="#111" stroke="#444" strokeWidth="1.5" />
      {segData.map(seg =>
        seg.type === 'text'
          ? <text key={seg.key} x={seg.x} y={seg.y}
                  textAnchor="middle" dominantBaseline="middle"
                  fill="#fff" fontSize="13" fontWeight="700"
                  pointerEvents="none">{seg.label}</text>
          : <path key={seg.key} className="dseg" d={seg.d} fill={seg.fill}
                  onClick={() => onHit(seg.score, seg.label)}
                  aria-label={seg.label} />
      )}
      <circle className="dseg" cx={CX} cy={CY} r={R.BULL_O}
              fill="#27ae60" onClick={() => onHit(25, 'Bull')}  aria-label="Bull 25" />
      <circle className="dseg" cx={CX} cy={CY} r={R.BULL_I}
              fill="#c0392b" onClick={() => onHit(50, 'BULL')}  aria-label="BULL 50" />
      <circle cx={CX} cy={CY} r={R.DBL_O} fill="none" stroke="#222" strokeWidth="1.5" />
    </svg>
  );
});

/* ─── Checkout calculator ────────────────────────────────────────────────────── */

// All scoreable darts ordered high→low (greedy preference for big scores)
const ALL_DART_THROWS = (() => {
  const darts = [];
  for (let i = 20; i >= 1; i--) {
    darts.push({ score: i * 3, label: `T${i}` });
    darts.push({ score: i * 2, label: `D${i}` });
    darts.push({ score: i,     label: String(i) });
  }
  darts.push({ score: 50, label: 'BULL' });
  darts.push({ score: 25, label: 'Bull' });
  return darts;
})();

// Map from dart score → preferred label (triple > double > single, high → low)
const DART_SCORE_TO_LABEL = (() => {
  const map = new Map();
  for (const d of ALL_DART_THROWS) {
    if (!map.has(d.score)) map.set(d.score, d.label);
  }
  return map;
})();

// Double-out: last dart must be a double (D1–D20 or double bull)
function getCheckout(score, maxDarts) {
  if (score < 2 || score > 170 || maxDarts < 1) return null;

  const doubleLabel = {};
  for (let i = 1; i <= 20; i++) doubleLabel[i * 2] = `D${i}`;
  doubleLabel[50] = 'BULL';

  // 1-dart checkout
  if (doubleLabel[score]) return [doubleLabel[score]];
  if (maxDarts === 1) return null;

  // 2-dart checkout
  for (const d1 of ALL_DART_THROWS) {
    const need = score - d1.score;
    if (need >= 2 && doubleLabel[need]) return [d1.label, doubleLabel[need]];
  }
  if (maxDarts === 2) return null;

  // 3-dart checkout
  for (const d1 of ALL_DART_THROWS) {
    const rem1 = score - d1.score;
    if (rem1 < 2) continue;
    for (const d2 of ALL_DART_THROWS) {
      const need = rem1 - d2.score;
      if (need >= 2 && doubleLabel[need]) return [d1.label, d2.label, doubleLabel[need]];
    }
  }
  return null;
}

// Single-out: last dart can be any valid dart value
function getCheckoutSingle(score, maxDarts) {
  if (score < 1 || maxDarts < 1) return null;
  if (maxDarts === 1 && score > 60)  return null; // max single dart: T20 = 60
  if (maxDarts === 2 && score > 120) return null; // max two darts:   T20+T20 = 120
  if (score > 180) return null;                   // max three darts: T20+T20+T20 = 180

  // 1-dart checkout
  if (DART_SCORE_TO_LABEL.has(score)) return [DART_SCORE_TO_LABEL.get(score)];
  if (maxDarts === 1) return null;

  // 2-dart checkout
  for (const d1 of ALL_DART_THROWS) {
    const need = score - d1.score;
    if (need >= 1 && DART_SCORE_TO_LABEL.has(need)) return [d1.label, DART_SCORE_TO_LABEL.get(need)];
  }
  if (maxDarts === 2) return null;

  // 3-dart checkout
  for (const d1 of ALL_DART_THROWS) {
    const rem1 = score - d1.score;
    if (rem1 < 1) continue;
    for (const d2 of ALL_DART_THROWS) {
      const need = rem1 - d2.score;
      if (need >= 1 && DART_SCORE_TO_LABEL.has(need)) return [d1.label, d2.label, DART_SCORE_TO_LABEL.get(need)];
    }
  }
  return null;
}

function calculateCheckout(remaining, dartsLeft, finishMode) {
  if (finishMode === 'double') return getCheckout(remaining, dartsLeft);
  if (finishMode === 'single') return getCheckoutSingle(remaining, dartsLeft);
  return null;
}

                aria-label={t('shufflePlayers')}
                onClick={handleShuffle}
                disabled={!canShuffle}>{t('shufflePlayers')}</button>
        <button className="btn btn-red"
                style={{ fontSize: '1.1rem', padding: '1rem' }}
                onClick={handleStart}>{t('startGame')}</button>
        {error && <p className="setup-error">{error}</p>}
      </div>
    </div>
  );
}

/* ─── GameScreen ─────────────────────────────────────────────────────────────── */
function GameScreen({ game, onDartHit, onUndo, onAdvance, onHome, onShare }) {
  const { t } = useLang();
  const [manualVal, setManualVal] = useState('');
  const [manualErr, setManualErr] = useState(false);
  const [historyModal, setHistoryModal] = useState(null);
  const inputRef = useRef(null);

  const cp     = game.currentPlayer;
  const locked = game.darts.length >= 3 || game.isBust;

  const nextLabel = (game.darts.length >= 3 || game.isBust)
    ? t('nextPlayer')
    : game.darts.length === 0 ? t('skipTurn') : t('doneNext');

  // Checkout hints
  const finishMode = normalizeFinishMode(game.finishMode);
  const remaining = game.scores[cp] - game.turnScore;
  const dartsLeft = 3 - game.darts.length;
  const checkout  = (!game.isBust && dartsLeft > 0)
    ? calculateCheckout(remaining, dartsLeft, finishMode)
    : null;

  const turnHistoryByPlayer = useMemo(() => {
    const snapshots = Array.isArray(game.stateHistory) ? game.stateHistory : [];
    const turns = snapshots
      .filter(st => Number.isInteger(st.currentPlayer))
      .map((st, idx) => ({
        id: `snap-${idx}`,
        player: st.currentPlayer,
        round: st.round,
        points: st.isBust ? 0 : st.turnScore,
        bust: Boolean(st.isBust),
        darts: Array.isArray(st.darts) ? st.darts.map(d => d.label).filter(Boolean) : [],
      }));

    if ((game.phase === 'playing' || game.phase === 'won') && (game.darts.length > 0 || game.isBust)) {
      turns.push({
        id: 'current-turn',
        player: game.currentPlayer,
        round: game.round,
        points: game.isBust ? 0 : game.turnScore,
        bust: Boolean(game.isBust),
        darts: game.darts.map(d => d.label).filter(Boolean),
      });
    }

    const grouped = game.players.map(() => []);
    turns.forEach(turn => {
      if (grouped[turn.player]) grouped[turn.player].push(turn);
    });
    return grouped;
  }, [
    game.stateHistory,
    game.phase,
    game.darts,
    game.isBust,
    game.currentPlayer,
    game.round,
    game.turnScore,
    game.players,
  ]);

  const submitManual = () => {
    const v = parseInt(manualVal, 10);
    if (isNaN(v) || v < 0 || v > 60) {
      setManualErr(true);
      setTimeout(() => setManualErr(false), 700);
      return;
    }
    onDartHit(v, String(v), false);
    setManualVal('');
    inputRef.current?.focus();
  };

  return (
    <div className="game-screen">
      <div className="game-header">
        <span className="round-badge">{t('round')} {game.round}</span>
        <span className="cp-name">{game.players[cp]}</span>
        <div className="header-right">
          <span className="dart-counter">{game.darts.length}/3 🎯</span>
          <button className="btn btn-icon history-icon"
                  type="button"
                  onClick={() => setHistoryModal('all')}
                  aria-label={t('viewAllHistory')}>☰</button>
          <button className="btn btn-icon share-icon" onClick={onShare} aria-label={t('shareGame')}>⎋</button>
          <button className="btn btn-icon home-icon" onClick={onHome} aria-label={t('goHome')}>⌂</button>
        </div>
      </div>

      <div className="scoreboard">
        {game.players.map((name, i) => {
          const roundsCompleted = i < cp ? game.round : game.round - 1;
          const pointsScored    = game.startScore - game.scores[i];
          const avg             = roundsCompleted > 0 ? (pointsScored / roundsCompleted).toFixed(1) : '—';
          return (
            <button key={i}
                    type="button"
                    className={`score-card score-card-btn${i === cp ? ' active' : ''}`}
                    onClick={() => setHistoryModal(i)}
                    aria-label={`${t('playerHistory')}: ${name}`}>
              <span className="sc-name">{name}</span>
              <span className="sc-val">{game.scores[i]}</span>
              <span className="sc-avg">{t('avg')} {avg}</span>
            </button>
          );
        })}
      </div>

      <div className="dartboard-wrap">
        <Dartboard onHit={onDartHit} />
      </div>

      <div className="game-bottom">
        <div className="throw-row">
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: '2px' }}>
            {checkout && (
              <div style={{ display: 'flex', gap: '0.4rem' }}>
                {[0, 1, 2].map(i => {
                  const hintIdx = i - game.darts.length;
                  const hint = (hintIdx >= 0 && hintIdx < checkout.length) ? checkout[hintIdx] : null;
                  return <div key={i} className="checkout-hint">{hint || ''}</div>;
                })}
              </div>
            )}
            <div className="dart-chips">
              {[0, 1, 2].map(i => {
                const d = game.darts[i];
                if (!d) return <div key={i} className="chip chip-empty">·</div>;
                return <div key={i} className={`chip ${d.isMiss ? 'chip-miss' : 'chip-used'}`}>{d.label}</div>;
              })}
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div className="turn-lbl">{t('turn')}</div>
            <div className="turn-score">
              <div className="turn-val">{game.turnScore}</div>
              <div className="turn-left">{remaining}</div>
            </div>
          </div>
        </div>

        {game.isBust && <div className="bust-bar">{t('bust')}</div>}

        <div className="manual-row">
          <input
            ref={inputRef}
            type="number"
            min="0" max="60"
            placeholder={t('manualHint')}
            inputMode="numeric"
            value={manualVal}
            disabled={locked}
            style={manualErr ? { borderColor: '#e94560' } : {}}
            onChange={e => setManualVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && submitManual()}
          />
          <button className="btn btn-amber" disabled={locked}
                  onClick={() => onDartHit(0, 'Miss', true)}>{t('miss')}</button>
          <button className="btn btn-green" disabled={locked}
                  onClick={submitManual}>{t('add')}</button>
        </div>

        <div className="action-row">
          <button className="btn btn-gray" style={{ flex: 1 }}
                  disabled={game.darts.length === 0 && !game.isBust && !(game.stateHistory && game.stateHistory.length > 0)}
                  onClick={onUndo}>{t('undo')}</button>
          <button className="btn btn-red" style={{ flex: 2 }}
                  onClick={onAdvance}>{nextLabel}</button>
        </div>
      </div>

      {historyModal !== null && (
        <div className="history-modal-backdrop" onClick={() => setHistoryModal(null)}>
          <div className="history-modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <div className="history-modal-header">
              <div className="history-modal-title">
                {historyModal === 'all'
                  ? t('allPlayersHistory')
                  : `${game.players[historyModal]} · ${t('history')}`}
              </div>
              <button className="btn btn-gray btn-sm" onClick={() => setHistoryModal(null)}>{t('close')}</button>
            </div>
            <div className="history-modal-content">
              {(historyModal === 'all' ? game.players.map((_, i) => i) : [historyModal]).map(i => {
                const turns = turnHistoryByPlayer[i] || [];
                return (
                  <div key={i} className="history-player-block">
                    {historyModal === 'all' && <div className="history-player-name">{game.players[i]}</div>}
                    {turns.length === 0 ? (
                      <div className="history-empty">{t('noTurnsYet')}</div>
                    ) : (
                      <div className="history-turn-list">
                        {turns.map(turn => (
                          <div key={turn.id} className="history-turn-row">
                            <span>{t('round')} {turn.round} · {turn.points} {t('pointsShort')}</span>
                            <span className="history-turn-meta">
                              {turn.bust ? t('bustShort') : (turn.darts.length ? turn.darts.join(', ') : '—')}
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── WinScreen ──────────────────────────────────────────────────────────────── */
function WinScreen({ game, onRematch, onNewGame, onHome, readOnly = false }) {
  const { t } = useLang();
  return (
    <div className="win-screen">
      {readOnly && (
        <button className="btn btn-gray back-btn" onClick={onHome}>{t('back')}</button>
      )}
      <div className="trophy">🏆</div>
      <div className="win-title">{game.players[game.winner]} {t('wins')}</div>
      <div className="win-sub">{t('game')} {game.startScore} · {t('round')} {game.round}</div>
      {game.finishedAt && <div className="win-date">{fmtDate(game.finishedAt)}</div>}

      <div className="final-scores">
        {game.players.map((name, i) => (
          <div key={i} className={`fs-row${i === game.winner ? ' winner-row' : ''}`}>
            <span>{name}{i === game.winner ? ' 🏆' : ''}</span>
            <span>{game.scores[i]}</span>
          </div>
        ))}
      </div>

      <div className="win-actions">
        {readOnly ? (
          <button className="btn btn-red"
                  style={{ fontSize: '1.1rem', padding: '1rem' }}
                  onClick={onHome}>{t('backToHome')}</button>
        ) : (
          <>
            <button className="btn btn-red"
                    style={{ fontSize: '1.1rem', padding: '1rem' }}
                    onClick={onRematch}>{t('rematch')}</button>
            <button className="btn btn-gray" style={{ padding: '0.9rem' }}
                    onClick={onNewGame}>{t('newGameBtn')}</button>
            <button className="btn btn-gray" style={{ padding: '0.9rem' }}
                    onClick={onHome}>{t('home')}</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────────────────────────── */
function App() {
  const [screen,  setScreen]  = useState('home');
  const [game,    setGame]    = useState(null);
  const [history, setHistory] = useState(() => readHistory());
  const [toastMsg, showToast] = useToast();
  const [lang, setLangState]  = useState(() => {
    const urlLang = getLangFromUrl();
    if (urlLang) return urlLang;
    try { return normalizeLang(localStorage.getItem(LS_LANG)) || 'en'; } catch { return 'en'; }
  });

  const setLang = useCallback(l => {
    const normalizedLang = normalizeLang(l) || 'en';
    setLangState(normalizedLang);
    try { localStorage.setItem(LS_LANG, normalizedLang); } catch { /* private/storage-full — silently ignore */ }
  }, []);

  const t = useCallback(key => (TRANSLATIONS[lang] || TRANSLATIONS.en)[key] || key, [lang]);

  const announceNextGame = useCallback((finishedGame, nextGameId) => {
    const normalizedNextGameId = typeof nextGameId === 'string' ? nextGameId.trim() : '';
    if (!finishedGame?.id || finishedGame.phase !== 'won' || !normalizedNextGameId || finishedGame.id === normalizedNextGameId) return;
    syncToBackend({ ...finishedGame, nextGameId: normalizedNextGameId, updatedAt: Date.now() });
  }, []);

  const followSuccessorGame = useCallback(async (currentGameId, successorGameId) => {
    const nextGameId = typeof successorGameId === 'string' ? successorGameId.trim() : '';
    if (!nextGameId || nextGameId === currentGameId) return false;
    const nextRemote = await fetchFromBackend(nextGameId);
    if (!nextRemote?.id || nextRemote.id !== nextGameId) return false;
    setGameUrlParam(nextGameId, lang);
    setGame(nextRemote);
    setScreen(nextRemote.phase === 'won' ? 'win' : 'game');
    return true;
  }, [lang]);

  /* Auto-save active game to localStorage whenever in-progress state changes */
  useEffect(() => {
    if (game?.phase === 'playing') writeActive(game);
  }, [game]);

  /* Sync every game state change to the backend (fire-and-forget, offline-safe) */
  useEffect(() => {
    if (game?.id && (game.phase === 'playing' || game.phase === 'won')) {
      syncToBackend(game);
    }
  }, [game]);

  /* Poll backend every POLL_MS when a game is active — apply if remote is newer */
  const gameRef = useRef(game);
  useEffect(() => { gameRef.current = game; }, [game]);
  useEffect(() => {
    if (!game?.id || (screen !== 'game' && screen !== 'win')) return;
    const id = game.id;
    const iv = setInterval(async () => {
      try {
        const remote = await fetchFromBackend(id);
        if (!remote?.id || remote.id !== id) return;
        const local = gameRef.current;
        if (!local || local.id !== id) return; // guard: game changed while request was in-flight
        // If finished game points to a successor, switch to that game instead of applying old state.
        if (await followSuccessorGame(id, remote.nextGameId)) return;
        if ((remote.updatedAt ?? 0) > (local.updatedAt ?? 0)) {
          setGame(remote);
        }
      } catch { /* offline — silently ignore */ }
    }, POLL_MS);
    return () => clearInterval(iv);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [game?.id, screen]);

  /* On mount: load game from ?game=<id> URL param (offline-safe) */
  useEffect(() => {
    const urlId = getGameIdFromUrl();
    const urlLang = getLangFromUrl();
    if (!urlId) return;
    try {
      const params = new URLSearchParams(window.location.search);
      const gameParamCount = params.getAll(GAME_ID_PARAM).length;
      const langParamCount = params.getAll(LANG_PARAM).length;
      const hasOnlyAllowedParams = [...params.keys()].every(key => key === GAME_ID_PARAM || key === LANG_PARAM);
      const isNormalized =
        hasOnlyAllowedParams &&
        gameParamCount === 1 &&
        langParamCount <= 1 &&
        (!params.has(LANG_PARAM) || !!urlLang);
      if (!isNormalized) setGameUrlParam(urlId, urlLang || lang);
    } catch { /* noop */ }
    const local = readActive();
    if (local?.id === urlId) { setGame(local); setScreen('game'); return; }
    fetchFromBackend(urlId).then(async remote => {
      if (!remote?.id) return;
      if (remote.id !== urlId) return;
      if (await followSuccessorGame(remote.id, remote.nextGameId)) return;
      setGame(remote);
      setScreen(remote.phase === 'won' ? 'win' : 'game');
    }).catch(() => {}); // backend offline — silently ignore
  }, [followSuccessorGame, lang]); // only on mount

  /* When a game is won, archive it and navigate to win screen */
  useEffect(() => {
    if (game?.phase === 'won' && screen === 'game') {
      clearActive();
      pushToHistory(game);
      setHistory(readHistory());
      setScreen('win');
    }
  }, [game?.phase, screen]);

  /* Show BUST toast on transition to isBust */
  const wasBustRef = useRef(false);
  useEffect(() => {
    const bust = game?.isBust ?? false;
    if (bust && !wasBustRef.current) showToast(t('bustToast'));
    wasBustRef.current = bust;
  }, [game?.isBust, showToast, t]);

  /* ── Navigation ── */
  const goHome = useCallback(() => { clearGameUrlParam(lang); setGame(null); setScreen('home'); }, [lang]);

  const handleNewGame = useCallback(() => {
    if (readActive()) {
      if (!window.confirm(t('confirmInProgress'))) return;
      clearActive();
    }
    setScreen('setup');
  }, [t]);

  const handleStart = useCallback((players, opts) => {
    const previousWon = game?.phase === 'won' ? game : null;
    const g = newGame(players, opts);
    announceNextGame(previousWon, g.id);
    setGame(g);
    setGameUrlParam(g.id, lang);
    setScreen('game');
  }, [announceNextGame, game, lang]);

  const handleResume = useCallback(() => {
    const active = readActive();
    if (active) { setGame(active); setGameUrlParam(active.id, lang); setScreen('game'); }
  }, [lang]);

  const handleViewGame = useCallback(g => { setGame(g); setScreen('view'); }, []);

  const handleDeleteGame = useCallback(id => {
    const h = readHistory().filter(g => g.id !== id);
    writeHistory(h);
    setHistory(h);
  }, []);

  const handleClearHistory = useCallback(() => {
    if (!window.confirm(t('confirmClear'))) return;
    writeHistory([]);
    setHistory([]);
  }, [t]);

  /* ── Game actions ── */
  const dartHit = useCallback((score, label, isMiss = false) => {
    setGame(prev => {
      if (!prev || prev.darts.length >= 3 || prev.isBust) return prev;
      const remaining = prev.scores[prev.currentPlayer] - prev.turnScore - score;
      if (remaining < 0) return { ...prev, isBust: true, updatedAt: Date.now() };
      const darts     = [...prev.darts, { score, label, isMiss }];
      const turnScore = prev.turnScore + score;
      if (remaining === 0) {
        // Double-out: last dart must be a double (D1–D20 or BULL)
        const isDouble = label.startsWith('D') || label === 'BULL';
        const finishMode = normalizeFinishMode(prev.finishMode);
        if (finishMode === 'double' && !isDouble) return { ...prev, isBust: true, updatedAt: Date.now() };
        const scores = [...prev.scores];
        scores[prev.currentPlayer] = 0;
        return { ...prev, darts, turnScore, scores,
                 winner: prev.currentPlayer, phase: 'won', finishedAt: Date.now(), updatedAt: Date.now() };
      }
      return { ...prev, darts, turnScore, updatedAt: Date.now() };
    });
  }, []);

  const undoDart = useCallback(() => {
    setGame(prev => {
      if (!prev) return prev;
      if (prev.isBust) return { ...prev, isBust: false, updatedAt: Date.now() };
      if (prev.darts.length === 0) {
        if (!prev.stateHistory || prev.stateHistory.length === 0) return prev;
        const stateHistory = prev.stateHistory.slice(0, -1);
        const { stateHistory: _, ...restoredState } = prev.stateHistory[prev.stateHistory.length - 1];
        return { ...restoredState, stateHistory, updatedAt: Date.now() };
      }
      const darts = prev.darts.slice(0, -1);
      return { ...prev, darts, turnScore: prev.turnScore - prev.darts[prev.darts.length - 1].score, updatedAt: Date.now() };
    });
  }, []);

  const advancePlayer = useCallback(() => {
    setGame(prev => {
      if (!prev) return prev;
      const scores = [...prev.scores];
      if (!prev.isBust) scores[prev.currentPlayer] -= prev.turnScore;
      const cp = (prev.currentPlayer + 1) % prev.players.length;
      const { stateHistory: _stateHistory, ...snapshot } = prev;
      const stateHistory = [...(prev.stateHistory || []), snapshot];
      return { ...prev, scores, currentPlayer: cp,
               round: cp === 0 ? prev.round + 1 : prev.round,
               darts: [], turnScore: 0, isBust: false, updatedAt: Date.now(), stateHistory };
    });
  }, []);

  const handleShare = useCallback(() => {
    if (!game?.id) return;
    const url = getGameShareUrl(game.id, lang);
    if (navigator.share) {
      navigator.share({ url, title: '🎯 Dart 501' }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => showToast(t('linkCopied'))).catch(() => {});
    }
  }, [game?.id, lang, showToast, t]);

  const rematch = useCallback(() => {
    if (!game) return;
    const g = newGame(shufflePlayers(game.players), { startScore: game.startScore, finishMode: game.finishMode });
    announceNextGame(game, g.id);
    setGame(g);
    setGameUrlParam(g.id, lang);
    setScreen('game');
  }, [announceNextGame, game, lang]);

  /* ── Render ── */
  return (
    <LangContext.Provider value={{ lang, setLang, t }}>
      <>
        {screen === 'home' && (
          <HomeScreen
            history={history}
            onNewGame={handleNewGame}
            onResume={handleResume}
            onViewGame={handleViewGame}
            onDeleteGame={handleDeleteGame}
            onClearHistory={handleClearHistory}
          />
        )}
        {screen === 'setup' && (
          <SetupScreen onStart={handleStart} onBack={goHome} />
        )}
        {screen === 'game' && game && (
          <GameScreen
            game={game}
            onDartHit={dartHit}
            onUndo={undoDart}
            onAdvance={advancePlayer}
            onHome={goHome}
            onShare={handleShare}
          />
        )}
        {screen === 'win' && game && (
          <WinScreen
            game={game}
            onRematch={rematch}
            onNewGame={handleNewGame}
            onHome={goHome}
          />
        )}
        {screen === 'view' && game && (
          <WinScreen game={game} onHome={goHome} readOnly={true} />
        )}
        <Toast msg={toastMsg} />
      </>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
